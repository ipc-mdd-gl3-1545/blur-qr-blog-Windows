<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 · 模糊二维码</title>
  <meta name="description" content="阅读全文 —— 模糊二维码" />
  <link rel="stylesheet" href="assets/topic.css" />
  <style>
    .art-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 116px clamp(16px, 4vw, 32px) 60px;
    }

    .art-card {
      background: linear-gradient(180deg, rgba(40, 25, 66, .86), rgba(26, 15, 44, .9));
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 24px;
      padding: clamp(20px, 4vw, 44px);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 24px 70px rgba(20, 8, 40, .45);
    }

    .art-tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(167, 139, 250, .3);
      border: 1px solid rgba(255, 255, 255, .3);
      font-size: 12px;
      font-weight: 600;
    }

    .art-title {
      font-size: clamp(23px, 3.4vw, 36px);
      line-height: 1.4;
      font-weight: 800;
      margin: 16px 0 14px;
      letter-spacing: .5px;
      word-break: break-word;
    }

    .art-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12.5px;
      opacity: .7;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .16);
    }

    .art-body {
      margin-top: 24px;
      font-size: 16px;
      line-height: 2;
      color: rgba(255, 255, 255, .92);
      word-break: break-word
    }

    .art-body p {
      margin: 0 0 18px;
      white-space: pre-wrap
    }

    /* 正文里的基础 Markdown 排版 */
    .art-body h2,
    .art-body h3,
    .art-body h4 {
      line-height: 1.5;
      margin: 30px 0 14px;
      font-weight: 700
    }

    .art-body h2 {
      font-size: 22px
    }

    .art-body h3 {
      font-size: 19px
    }

    .art-body h4 {
      font-size: 17px
    }

    .art-body h2::before,
    .art-body h3::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 17px;
      border-radius: 3px;
      margin-right: 10px;
      background: linear-gradient(180deg, var(--pink-soft), var(--violet));
      vertical-align: -2px
    }

    .art-body ul,
    .art-body ol {
      margin: 0 0 18px;
      padding-left: 24px
    }

    .art-body li {
      margin: 6px 0
    }

    .art-body blockquote {
      margin: 0 0 18px;
      padding: 12px 18px;
      border-left: 3px solid var(--pink);
      border-radius: 0 10px 10px 0;
      background: rgba(255, 255, 255, .07);
      color: rgba(255, 255, 255, .86)
    }

    .art-body code {
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .14);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .92em
    }

    .art-body hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, .18);
      margin: 28px 0
    }

    .art-body figure {
      margin: 24px 0
    }

    /* 图片按自身尺寸显示，超出容器才等比缩小 */
    .art-body img,
    .art-cover {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 22px auto;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      cursor: zoom-in;
      transition: filter .2s
    }

    .art-body img:hover,
    .art-cover:hover {
      filter: brightness(1.06)
    }

    .art-cover {
      margin: 24px auto
    }

    .art-actions {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, .16);
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .btn-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--stroke);
      color: var(--ink);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: .2s
    }

    .btn-line:hover {
      background: var(--glass-strong);
      transform: translateY(-2px)
    }

    .art-state {
      text-align: center;
      padding: 70px 20px;
      font-size: 15px;
      line-height: 2;
      opacity: .82
    }

    /* 图片全屏查看 */
    #imgView {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: rgba(8, 3, 16, .93);
      backdrop-filter: blur(8px);
      cursor: zoom-out
    }

    #imgView.show {
      display: flex
    }

    #imgView img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .65)
    }

    #imgView .close {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .18);
      cursor: pointer
    }

    @media (max-width:640px) {
      .art-wrap {
        padding-top: 96px
      }

      .art-body {
        font-size: 15px;
        line-height: 1.95
      }
    }
  </style>
</head>

<body>
  <div class="bg-layer">
    <video class="bg-video" autoplay muted loop playsinline poster="assets/poster.jpg">
      <source src="assets/bg.mp4" type="video/mp4" />
    </video>
  </div>
  <div class="bg-overlay"></div>

  <nav class="topnav">
    <a href="index.html" class="brand">
      <span class="logo">✦</span>
      <span>模糊二维码<small>ARTICLE</small></span>
    </a>
    <a href="index.html" class="back-home">
      <svg viewBox="0 0 24 24"><path d="M12 6l-8 8 1.41 1.41L12 8.83l6.59 6.58L20 14l-8-8z" /></svg>
      返回首页
    </a>
  </nav>

  <main class="art-wrap">
    <article class="art-card" id="artCard">
      <div class="art-state">正在加载文章…</div>
    </article>
  </main>

  <footer>© 2026 模糊二维码 · 用代码与文字记录生活</footer>

  <div id="imgView"><img alt="" /><span class="close">✕</span></div>

  <script>
    (function () {
      const card = document.getElementById('artCard');
      const view = document.getElementById('imgView');
      const bigImg = view.querySelector('img');

      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const fmtDate = ts => {
        const d = new Date(ts), p = n => String(n).padStart(2, '0');
        return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
      };
      const IMG_RE = /!\[([^\]]*)\]\((\/uploads\/[A-Za-z0-9._-]+)\)/g;
      const IMG_ONLY = /^!\[([^\]]*)\]\((\/uploads\/[A-Za-z0-9._-]+)\)$/;

      function inline(s) {
        return esc(s)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(IMG_RE, (_m, alt, url) => '<img src="' + url + '" alt="' + alt + '" loading="lazy">');
      }

      // 纯文本 → 段落 / 小标题 / 列表 / 引用 / 分割线；图片单独成块，先转义再放行站内图片
      function renderBody(text) {
        const lines = String(text || '').split(/\r?\n/);
        let out = '', para = [], list = null, quote = [];
        const flushPara = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
        const flushList = () => {
          if (list) { out += '<' + list.tag + '>' + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + '</' + list.tag + '>'; list = null; }
        };
        const flushQuote = () => { if (quote.length) { out += '<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>'; quote = []; } };
        const flushAll = () => { flushPara(); flushList(); flushQuote(); };

        for (const raw of lines) {
          const t = raw.trim();
          if (!t) { flushAll(); continue; }

          const img = t.match(IMG_ONLY);
          if (img) { flushAll(); out += '<figure><img src="' + img[2] + '" alt="' + esc(img[1]) + '" loading="lazy"></figure>'; continue; }

          const h = t.match(/^(#{1,4})\s+(.*)$/);
          if (h) { flushAll(); const lv = Math.min(h[1].length + 1, 4); out += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'; continue; }

          if (/^(-{3,}|\*{3,})$/.test(t)) { flushAll(); out += '<hr>'; continue; }

          const ul = t.match(/^[-*+]\s+(.*)$/);
          if (ul) { flushPara(); flushQuote(); if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; } list.items.push(ul[1]); continue; }

          const ol = t.match(/^\d+[.)]\s+(.*)$/);
          if (ol) { flushPara(); flushQuote(); if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; } list.items.push(ol[1]); continue; }

          if (/^>\s?/.test(t)) { flushPara(); flushList(); quote.push(t.replace(/^>\s?/, '')); continue; }

          flushList(); flushQuote(); para.push(raw);
        }
        flushAll();
        return out || '<p style="opacity:.6">（这篇还没有正文）</p>';
      }

      function fail(msg) {
        card.innerHTML = '<div class="art-state">' + esc(msg) + '<br><br>' +
          '<a class="btn-line" href="index.html">← 返回首页</a></div>';
        document.title = '文章不存在 · 模糊二维码';
      }

      function render(a) {
        document.title = a.title + ' · 模糊二维码';
        card.innerHTML =
          (a.tag ? '<span class="art-tag">' + esc(a.tag) + '</span>' : '') +
          '<h1 class="art-title">' + esc(a.title) + '</h1>' +
          '<div class="art-meta"><span>🕒 ' + fmtDate(a.created) + '</span>' +
          '<span>👀 ' + (a.views || 1) + ' 次阅读</span></div>' +
          (a.cover ? '<img class="art-cover" src="' + esc(a.cover) + '" alt="' + esc(a.title) + '">' : '') +
          '<div class="art-body">' + renderBody(a.body) + '</div>' +
          '<div class="art-actions"><a class="btn-line" href="index.html">← 返回首页</a>' +
          '<a class="btn-line" href="index.html#writing">看更多文章</a></div>';
      }

      const id = new URLSearchParams(location.search).get('id') || location.hash.replace('#', '');
      if (!/^\d+$/.test(id)) {
        fail('缺少文章编号');
        return;
      }

      fetch('api/articles/' + id, { credentials: 'same-origin', cache: 'no-store' })
        .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status === 404 ? '文章不存在或已下线' : '读取失败')))
        .then(d => { if (!d.article) throw new Error('文章不存在或已下线'); render(d.article); })
        .catch(e => fail(e.message === '文章不存在或已下线' ? e.message : '加载失败，请稍后再试'));

      // 点击图片全屏
      document.addEventListener('click', e => {
        const img = e.target.closest('.art-body img, .art-cover');
        if (!img) return;
        bigImg.src = img.src; bigImg.alt = img.alt || '';
        view.classList.add('show');
      });
      view.addEventListener('click', () => { view.classList.remove('show'); bigImg.removeAttribute('src'); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && view.classList.contains('show')) {
          view.classList.remove('show'); bigImg.removeAttribute('src');
        }
      });
    })();
  </script>
<script src="/assets/watchdog.js" defer></script>
</body>

</html>
