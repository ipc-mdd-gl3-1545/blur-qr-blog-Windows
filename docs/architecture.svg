<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="470" viewBox="0 0 1040 470" xmlns="http://www.w3.org/2000/svg"
                 font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="1040" height="470" fill="#150d26" rx="14"/>
              <defs>
                <marker id="wArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M1 1L9 5L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </marker>
                <linearGradient id="wApp" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#2b2350"/><stop offset="1" stop-color="#241d44"/>
                </linearGradient>
                <linearGradient id="wStore" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#1e2b47"/><stop offset="1" stop-color="#1a2440"/>
                </linearGradient>
              </defs>

              <text x="520" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#f4ecff">一个进程 · 一个数据库文件 · 零第三方依赖</text>
              <text x="520" y="50" text-anchor="middle" font-size="10.5" fill="#a99cc4">浏览器请求进来，Node 自己既当 Web 服务器又当 API，数据写进本机 SQLite</text>

              <!-- 浏览器 -->
              <rect x="420" y="70" width="200" height="52" rx="10" fill="#3a2358" stroke="#6b4a9e" stroke-width="1.2"/>
              <text x="520" y="92" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e9dcff">浏览器 / 访客</text>
              <text x="520" y="110" text-anchor="middle" font-size="9" fill="#bda8dd">首页 · 文章 · 小影院 · 后台</text>

              <line x1="520" y1="122" x2="520" y2="152" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#wArrow)"/>
              <text x="532" y="143" font-size="8.5" fill="#a99cc4">HTTP :8080</text>

              <!-- Node 主框 -->
              <rect x="180" y="152" width="680" height="132" rx="12" fill="url(#wApp)" stroke="#5b4a8f" stroke-width="1.3"/>
              <circle id="dot-app" cx="838" cy="172" r="4.5" fill="#6b5a8f"/>
              <text x="200" y="176" font-size="12" font-weight="700" fill="#efe6ff">Node.js 22 · server.js（单进程）</text>
              <text x="200" y="192" font-size="9" fill="#a99cc4">只依赖 Node 内置模块，不需要 Apache / MySQL / PHP</text>

              <rect x="200" y="204" width="148" height="62" rx="8" fill="#332a5c" stroke="#4d3f7d"/>
              <text x="274" y="226" text-anchor="middle" font-size="9.5" font-weight="600" fill="#e6dbff">静态页面</text>
              <text x="274" y="243" text-anchor="middle" font-size="8.5" fill="#b3a3d4">HTML / CSS / JS</text>
              <text x="274" y="257" text-anchor="middle" font-size="8.5" fill="#b3a3d4">视频 · 图片直出</text>

              <rect x="366" y="204" width="148" height="62" rx="8" fill="#332a5c" stroke="#4d3f7d"/>
              <text x="440" y="226" text-anchor="middle" font-size="9.5" font-weight="600" fill="#e6dbff">JSON API</text>
              <text x="440" y="243" text-anchor="middle" font-size="8.5" fill="#b3a3d4">/api/* 路由</text>
              <text x="440" y="257" text-anchor="middle" font-size="8.5" fill="#b3a3d4">文章 · 弹幕 · 上传</text>

              <rect x="532" y="204" width="148" height="62" rx="8" fill="#332a5c" stroke="#4d3f7d"/>
              <text x="606" y="226" text-anchor="middle" font-size="9.5" font-weight="600" fill="#e6dbff">会话与防护</text>
              <text x="606" y="243" text-anchor="middle" font-size="8.5" fill="#b3a3d4">Cookie 签名</text>
              <text x="606" y="257" text-anchor="middle" font-size="8.5" fill="#b3a3d4">同源校验 · 登录限流</text>

              <rect x="698" y="204" width="148" height="62" rx="8" fill="#332a5c" stroke="#4d3f7d"/>
              <text x="772" y="226" text-anchor="middle" font-size="9.5" font-weight="600" fill="#e6dbff">日志与指标</text>
              <text x="772" y="243" text-anchor="middle" font-size="8.5" fill="#b3a3d4">内存环形缓冲</text>
              <text x="772" y="257" text-anchor="middle" font-size="8.5" fill="#b3a3d4">落盘轮转 · 采样</text>

              <!-- 两条落盘箭头 -->
              <path d="M400 284 L400 310 L330 310 L330 326" fill="none" stroke="#6aa9ff" stroke-width="1.5" marker-end="url(#wArrow)"/>
              <path d="M640 284 L640 310 L710 310 L710 326" fill="none" stroke="#6aa9ff" stroke-width="1.5" marker-end="url(#wArrow)"/>

              <!-- SQLite -->
              <rect x="180" y="326" width="300" height="96" rx="10" fill="url(#wStore)" stroke="#3f5f8f" stroke-width="1.2"/>
              <circle id="dot-db" cx="460" cy="344" r="4.5" fill="#4a6a94"/>
              <text x="200" y="352" font-size="11" font-weight="600" fill="#d8e6ff">SQLite · data/blog.db</text>
              <text x="200" y="372" font-size="9" fill="#93a9c9">文章、弹幕、访问量、错误记录</text>
              <text x="200" y="388" font-size="9" fill="#93a9c9">WAL 模式，读写互不阻塞</text>
              <text x="200" y="406" font-size="8.5" fill="#7d94b3">后台「数据库」页可直接查表、导出 CSV</text>

              <!-- 文件目录 -->
              <rect x="560" y="326" width="300" height="96" rx="10" fill="url(#wStore)" stroke="#3f5f8f" stroke-width="1.2"/>
              <circle id="dot-disk" cx="840" cy="344" r="4.5" fill="#4a6a94"/>
              <text x="580" y="352" font-size="11" font-weight="600" fill="#d8e6ff">本地目录</text>
              <text x="580" y="372" font-size="9" fill="#93a9c9">uploads/ 图片 · videos/ 视频</text>
              <text x="580" y="388" font-size="9" fill="#93a9c9">backups/ 数据库快照</text>
              <text x="580" y="406" font-size="8.5" fill="#7d94b3">整个项目目录拷走就能搬家</text>

              <!-- 可选前置 -->
              <text x="520" y="448" text-anchor="middle" font-size="8.5" fill="#7f719c">可选：前面加一层 Nginx（deploy/nginx.conf）做 HTTPS 与压缩；用 systemd 常驻（deploy/blog.service）；Windows 下直接双击启动即可</text>
            </svg>