<svg width="100%" viewBox="0 0 680 492" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>模糊二维码博客项目架构图</title>
<desc>五层架构：访客与管理端、前台与后台页面、零依赖 Node.js 后端、数据存储、部署运维</desc>
