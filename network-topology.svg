<svg width="100%" viewBox="0 0 900 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>模糊二维码博客 · 网络拓扑图</title>
<desc>访客经浏览器访问 Node.js 服务，服务再连接静态资源、SQLite、视频与弹幕目录、日志</desc>
<defs>
<marker id="topoArrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="rgba(167,139,250,.75)"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="360" fill="#141020"/>
<text x="26" y="26" font-size="14" font-weight="700" fill="#f4ecff">网络拓扑</text>
<text x="26" y="44" font-size="10" fill="#a99cc4">访客 → 浏览器 → Node → 静态资源 / 数据库 / 视频 / 日志</text>

<g fill="none" stroke="rgba(167,139,250,.42)" stroke-width="1.6" marker-end="url(#topoArrow)">
<path d="M115,170 L151,170"/>
<path d="M268,170 L313,170"/>
<path d="M446,170 C486.5,170 486.5,62 527,62"/>
<path d="M446,170 L527,170"/>
<path d="M446,170 C486.5,170 486.5,278 527,278"/>
<path d="M382,193 L382,254"/>
</g>
<g font-size="10" fill="#7f729a">
<text x="133" y="163" text-anchor="middle">HTTP</text>
<text x="290" y="163" text-anchor="middle">请求</text>
<text x="486" y="109" text-anchor="middle">页面</text>
<text x="486" y="163" text-anchor="middle">读写</text>
<text x="486" y="213" text-anchor="middle">Range</text>
<text x="389" y="227" text-anchor="start">记录</text>
</g>

<g>
<rect x="12" y="144" width="100" height="52" rx="11" fill="#241636" stroke="rgba(143,217,194,.6)" stroke-width="1.4"/>
<text x="62" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4ecff">访客</text>
<text x="62" y="184" text-anchor="middle" font-size="10" fill="#a99cc4">局域网设备</text>

<rect x="159" y="144" width="106" height="52" rx="11" fill="#241636" stroke="rgba(143,217,194,.6)" stroke-width="1.4"/>
<text x="212" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4ecff">浏览器</text>
<text x="212" y="184" text-anchor="middle" font-size="10" fill="#a99cc4">前台 + 后台</text>

<rect x="321" y="140" width="122" height="60" rx="11" fill="#2e1b48" stroke="#a78bfa" stroke-width="2"/>
<text x="382" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4ecff">Node.js</text>
<text x="382" y="177" text-anchor="middle" font-size="10" fill="#a99cc4">监听 8080</text>
<text x="382" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#8fd9c2">0.2 QPS</text>

<rect x="535" y="36" width="126" height="52" rx="11" fill="#241636" stroke="rgba(143,217,194,.6)" stroke-width="1.4"/>
<text x="598" y="60" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4ecff">静态资源</text>
<text x="598" y="76" text-anchor="middle" font-size="10" fill="#a99cc4">HTML / CSS / JS</text>

<rect x="535" y="144" width="126" height="52" rx="11" fill="#241636" stroke="rgba(143,217,194,.6)" stroke-width="1.4"/>
<text x="598" y="164" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4ecff">SQLite</text>
<text x="598" y="178" text-anchor="middle" font-size="10" fill="#a99cc4">2 表 / 4 行</text>
<text x="598" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#8fd9c2">4 KB</text>

<rect x="535" y="252" width="126" height="52" rx="11" fill="#241636" stroke="rgba(143,217,194,.6)" stroke-width="1.4"/>
<text x="598" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4ecff">视频 + 弹幕</text>
<text x="598" y="286" text-anchor="middle" font-size="10" fill="#a99cc4">本地目录</text>
<text x="598" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#8fd9c2">2 个</text>

<rect x="321" y="252" width="122" height="56" rx="11" fill="#241636" stroke="rgba(143,217,194,.6)" stroke-width="1.4"/>
<text x="382" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4ecff">日志</text>
<text x="382" y="286" text-anchor="middle" font-size="10" fill="#a99cc4">blog.log</text>
<text x="382" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#8fd9c2">21 条</text>
</g>

<text x="26" y="340" font-size="10" fill="#a99cc4">绿色描边 = 正常；粉色 = 异常（数据库空间不足或出现 5xx）。数值为采样快照，实时数据请在监控页查看。</text>
</svg>
