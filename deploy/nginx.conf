# ===================================================================
#  Nginx 反向代理配置（Ubuntu 26）
#  安装：sudo cp deploy/nginx.conf /etc/nginx/sites-available/blog
#        sudo ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/blog
#        sudo sed -i 's/__DOMAIN__/your-domain.com/g' /etc/nginx/sites-available/blog
#        sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS：sudo apt install -y certbot python3-certbot-nginx
#         sudo certbot --nginx -d your-domain.com
#         （certbot 会自动改写本文件，加上 443 监听与 80→443 跳转）
# ===================================================================

# ---------- 限流区（防刷，按 IP 每秒 20 个请求）----------
limit_req_zone $binary_remote_addr zone=blog_req:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 上传上限要 ≥ 后端 MAX_VIDEO_MB（默认 4096），否则大视频会在 nginx 这一层就被 413
    client_max_body_size 4096m;
    client_body_timeout 1800s;

    # 隐藏版本号
    server_tokens off;

    # 前端已由 Node 做 gzip，这里不再二次压缩
    gzip off;

    # 访问日志
    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log warn;

    # ---------- 基础安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 反代到 Node ----------
    location / {
        limit_req zone=blog_req burst=40 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 视频拖动依赖 Range，交给后端处理
        proxy_buffering off;
    }

    # ---------- 视频上传专用 ----------
    # 关掉请求体缓冲：nginx 默认要先把整个 body 落到临时文件再转发一遍，
    # 大视频会白白多写一次盘、多等一倍时间。off 之后是边收边转发。
    location = /api/admin/videos {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering         off;
        client_body_timeout     1800s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      1800s;
        proxy_read_timeout      1800s;
    }

    # 健康检查不写日志、不限流
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    # 隐藏文件一律拒绝
    location ~ /\.(?!well-known) {
        deny all;
    }
}
